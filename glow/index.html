<header><h1>✨ Ishu's Glow Up ✨</h1><div class="sub" id="cheer"></div><div class="streak" id="streak">🔥 0 day streak</div></header>

<script>
const API='https://api.restful-api.dev/objects/ff808181a09d98f701a15a6db1783289',NAME='ishu-glow-log';
const DAYS=[['d1','Day 1 🍑 Glutes'],['d2','Day 2 🧘 Core + hips'],['d3','Day 3 💪 Back + arms'],['d4','Day 4 🔥 Heavy glutes'],['rest','Rest 😴']];
const SKIN=[['5','✨ Glowing'],['4','😊 Good'],['3','🙂 Okay'],['2','😕 Meh'],['1','😣 Breakout']];
const MOOD=[['😍','😍'],['😊','😊'],['😐','😐'],['😴','😴'],['😢','😢'],['😤','😤']];
const CHEERS=['You\'re literally building your dream body 🍑','Tiny steps = big glow ✨','Showing up is the hardest part, and you did 💕','Protein queen in progress 👑','Future you is SO proud 🥹'];
let db={entries:{},messages:[]};const $=i=>document.getElementById(i);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function local(){try{return JSON.parse(localStorage.glow||'null')}catch(e){return null}}
function merge(a,b){const o={entries:{...(a.entries||{})},messages:[]};for(const[k,v]of Object.entries(b.entries||{})){if(!o.entries[k]||(v.updatedAt||'')>(o.entries[k].updatedAt||''))o.entries[k]=v}
const m=new Map();[...(a.messages||[]),...(b.messages||[])].forEach(x=>m.set(x.id,x));o.messages=[...m.values()].sort((x,y)=>x.ts<y.ts?-1:1);return o}
async function pull(){try{const r=await fetch(API,{cache:'no-store'});if(r.ok){const j=await r.json();db=merge(db,j.data||{})}}catch(e){}localStorage.glow=JSON.stringify(db)}
async function push(){localStorage.glow=JSON.stringify(db);await pull();const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:NAME,data:db})});if(!r.ok)throw r.status}
function chips(id,list,multi){const el=$(id);el.innerHTML='';list.forEach(([v,t])=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.dataset.v=v;b.onclick=()=>{el.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on')};el.appendChild(b)})}
const getChip=id=>($(id).querySelector('.on')||{}).dataset?.v||'';const setChip=(id,v)=>$(id).querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
let water=0;function drawWater(){$('water').innerHTML='';for(let i=1;i<=8;i++){const s=document.createElement('span');s.textContent='💧';s.className=i<=water?'on':'';s.onclick=()=>{water=water===i?i-1:i;drawWater()};$('water').appendChild(s)}$('wc').textContent=water}
function pc(){const n=['shake','bar','smoothie'].filter(k=>$(k).checked).length;$('pc').textContent=n+'/3'+(n===3?' 🎉':'');return n}
['shake','bar','smoothie'].forEach(k=>$(k).onchange=()=>{if(pc()===3)party()});$('done').onchange=()=>{if($('done').checked)party()};
function party(){window.confetti&&confetti({particleCount:140,spread:80,origin:{y:.7},colors:['#f9a8d4','#c4b5fd','#fbcfe8','#e9d5ff','#fff']})}
function load(){const e=db.entries[$('date').value]||{};setChip('day',e.day||'');$('done').checked=e.workout==='done';const p=e.protein||{};['shake','bar','smoothie'].forEach(k=>$(k).checked=!!p[k]);pc();
$('food').value=e.food||'';setChip('skin',e.skin||'');$('skinNotes').value=e.skinNotes||'';water=+e.water||0;drawWater();setChip('mood',e.mood||'');$('notes').value=e.notes||''}
const good=e=>e&&(e.workout==='done'||e.day==='rest'||(e.protein&&Object.values(e.protein).filter(Boolean).length===3));
function stats(){let s=0,d=new Date();if(!good(db.entries[today()]))d.setDate(d.getDate()-1);while(true){const k=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);if(good(db.entries[k])){s++;d.setDate(d.getDate()-1)}else break}
$('streak').textContent=`🔥 ${s} day streak`+(s>=7?' 👑':'');const w=$('week');w.innerHTML='';const n=new Date();const mon=new Date(n);mon.setDate(n.getDate()-((n.getDay()+6)%7));
for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),e=db.entries[k];let ic='·';
if(e){const pr=e.protein?Object.values(e.protein).filter(Boolean).length:0;ic=e.workout==='done'?(pr===3?'🌟':'💪'):e.day==='rest'?'😴':pr===3?'🍗':'🌱'}
