name: decode-icons
on:
  push:
    paths: ['glow/icons-src/*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in glow/icons-src/*.b64; do base64 -d "$f" > "glow/$(basename "$f" .b64).png"; done
          git config user.name icon-bot && git config user.email icon-bot@users.noreply.github.com
          git add glow/*.png && git commit -m "Decode icons" && git push || echo nothing
